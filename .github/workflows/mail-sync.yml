# Every 15 minutes: ask the CRM to read new mail from info@bharatsteels.in (Claude extracts customer details).
# Needs one repository secret: CRON_SECRET (same value as CRON_SECRET in Vercel).
name: Mail check
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency: { group: mail-sync, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read new mail
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret first"; exit 1; fi
          curl -sS --fail-with-body -m 320 -H "Authorization: Bearer $CRON_SECRET" "https://crm.bharatsteels.in/api/cron?job=mail" | tee out.json
          echo
          grep -q '"ok":true' out.json || grep -q '"busy":true' out.json
